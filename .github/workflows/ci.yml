name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "30 5 * * 1"

env:
  UV_VERSION: "0.12.9"

jobs:
  python:
    runs-on: ubuntu-latest
    # No database, broker or Protect settings on purpose: the companion must run without them
    # (decision D1), and tests/test_protect_decoding.py checks that none is set.
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install (frozen lockfile)
        run: uv sync --frozen --all-groups
      - name: Ruff
        run: uv run ruff check . && uv run ruff format --check .
      - name: Mypy
        run: uv run mypy
      - name: Pytest
        run: |
          set -o pipefail
          uv run pytest -q -rfE --tb=short 2>&1 | tee pytest.log
      - name: Failures as annotations
        if: failure()
        run: grep -E "^(FAILED|ERROR) " pytest.log | head -10 | while read -r line; do echo "::error::$line"; done

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: English catalogue is current
        run: npm run i18n:check
      - run: npm run build
      - run: npm run test

  shell:
    name: desktop shell compiles
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: electron
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run build

  frozen-backend:
    name: the backend freezes and answers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --frozen --all-groups
      - run: cd frontend && npm ci && npm run build
      - run: uv run pyinstaller backend.spec --clean --noconfirm
      - name: Health names the decoders
        run: |
          PROTECT_GO_DATA_DIR="$RUNNER_TEMP/field-data" PROTECT_GO_PORT=18090 dist/backend/backend > backend-smoke.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:18090/api/health > health.json && break; sleep 1; done
          cat health.json; grep -q '"decoders":\["opencollar"\]' health.json

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --all-groups
      - run: uv run mkdocs build --strict
      - name: Links, anchors and diagrams
        run: uv run scripts/docs_check.py
      - name: Keep the built site for the pages job
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  pages:
    # The documentation site follows main, as Protect's does. Only a strictly built,
    # link-checked site lands.
    name: publish the docs site
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Make sure Pages is on, with GitHub Actions as its source
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - id: deploy
        uses: actions/deploy-pages@v4

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            electron/package-lock.json
      - name: Python dependencies (pip-audit, high and critical fail)
        # Protect's shared package comes from git, not PyPI, so it is left out of the export
        # (pip-audit cannot look it up); its own dependencies stay in and are audited.
        run: |
          uv export --frozen --all-groups --no-hashes --no-emit-project --no-emit-package smartparks-protect-shared --format requirements-txt -o requirements-audit.txt
          uvx pip-audit -r requirements-audit.txt --strict
      - name: Frontend dependencies (npm audit, high and critical fail)
        run: cd frontend && npm ci --ignore-scripts && npm audit --audit-level=high
      - name: Shell dependencies (npm audit, high and critical fail)
        run: cd electron && npm ci --ignore-scripts && npm audit --audit-level=high
