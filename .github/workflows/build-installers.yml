name: Build installers

# AddaxAI's release shape, with one change (decision D19): a pushed `v*` tag builds the three
# installers and attaches them to the tag's release, with `latest.yml` and the blockmap beside
# the Windows installer so an installed app updates itself from the release (decision D17), and
# the release is published only at the end, once every file is there. Until then it is a draft,
# which the updater and the download links do not see: a release published before its files
# existed sent an installed app a 404 for `latest.yml` (Tim, 2026-10-17). Releasing is: write
# the notes into a draft release (`gh release create vX.Y.Z --draft --notes-file …`), then push
# the tag; the `prepare` job makes a bare draft when none exists. A manual run builds debug
# installers kept as workflow artifacts for 14 days. The version comes from the tag into VERSION
# and electron/package.json. Signing and notarisation happen when the secrets are present;
# without them the build says so and the installer is unsigned (users then click through
# SmartScreen or Gatekeeper, see the user page). Once Smart Parks holds certificates, set
# REQUIRE_SIGNING to "1" below so a release can never ship unsigned.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  UV_VERSION: "0.12.9"
  REQUIRE_SIGNING: "0"

jobs:
  prepare:
    name: The draft release
    runs-on: ubuntu-22.04
    if: github.ref_type == 'tag'
    steps:
      - name: A draft release for the tag, when none exists yet
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME exists; the installers go on it."
          else
            gh release create "$GITHUB_REF_NAME" --draft --title "Protect Go $GITHUB_REF_NAME" --notes "Protect Go $GITHUB_REF_NAME. See CHANGELOG.md."
            echo "Draft release $GITHUB_REF_NAME made."
          fi

  build:
    name: Build (${{ matrix.label }})
    needs: [prepare]
    if: always() && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped')
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows
            runs-on: windows-2022
            artifact-glob: electron/dist-build/*.exe electron/dist-build/*.exe.blockmap electron/dist-build/latest.yml
            electron-builder-args: --win
          - label: macOS arm64
            os: macos
            runs-on: macos-14
            artifact-glob: electron/dist-build/*.dmg
            electron-builder-args: --mac --arm64
          - label: Linux x64
            os: linux
            runs-on: ubuntu-22.04
            artifact-glob: electron/dist-build/*.deb
            electron-builder-args: --linux
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Python 3.12 for the frozen backend
        run: uv python install 3.12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            electron/package-lock.json

      # VERSION (read by the backend) and electron/package.json (read by app.getVersion()) are
      # written from the tag in lockstep; a manual run off an untagged commit keeps v0.0.0, so
      # the About line of a debug build says what it is.
      - name: Sync the version from the tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="$(git describe --tags --exact-match HEAD 2>/dev/null || true)"
          fi
          if [ -z "$TAG" ]; then
            echo "No tag at HEAD; VERSION and electron/package.json stay as they are."
            exit 0
          fi
          printf 'v%s\n' "${TAG#v}" > VERSION
          (cd electron && npm version "${TAG#v}" --no-git-tag-version --allow-same-version)
          echo "Version ${TAG#v}"

      - name: Install
        run: |
          uv sync --frozen --all-groups
          (cd frontend && npm ci)
          (cd electron && npm ci)
          # npm 11 may hold back a package's install script; Electron's downloads the binary
          if [ ! -d electron/node_modules/electron/dist ]; then (cd electron && node node_modules/electron/install.js); fi

      - name: Build the interface
        run: cd frontend && npm run build

      - name: Freeze the backend
        run: uv run pyinstaller backend.spec --clean --noconfirm

      - name: The frozen backend answers
        run: |
          case "${{ matrix.os }}" in
            windows) BIN=dist/backend/backend.exe ;;
            *) BIN=dist/backend/backend ;;
          esac
          PROTECT_GO_DATA_DIR="$RUNNER_TEMP/field-data" PROTECT_GO_PORT=18090 "$BIN" > backend-smoke.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:18090/api/health > health.json; then break; fi
            sleep 1
          done
          cat health.json
          grep -q '"decoders":\["opencollar"\]' health.json
          kill %1 || true

      - name: Signing credentials
        id: signing
        env:
          WIN_CERT: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          MAC_CERT: ${{ secrets.MACOS_CERTIFICATE }}
        run: |
          have=0
          if [ "${{ matrix.os }}" = "windows" ] && [ -n "$WIN_CERT" ]; then have=1; fi
          if [ "${{ matrix.os }}" = "macos" ] && [ -n "$MAC_CERT" ]; then have=1; fi
          echo "have=$have" >> "$GITHUB_OUTPUT"
          if [ "$have" = "0" ] && [ "${{ matrix.os }}" != "linux" ]; then
            if [ "$REQUIRE_SIGNING" = "1" ] && [ "${{ github.ref_type }}" = "tag" ]; then
              echo "::error::No signing certificate for ${{ matrix.os }} and REQUIRE_SIGNING is on"
              exit 1
            fi
            echo "::warning::No signing certificate for ${{ matrix.os }}; the installer will be unsigned"
          fi

      - name: Import the macOS certificate
        if: matrix.os == 'macos' && steps.signing.outputs.have == '1'
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo -n "$CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          security create-keychain -p "$CERTIFICATE_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$CERTIFICATE_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$CERTIFICATE_PASSWORD" "$KEYCHAIN_PATH"

      - name: Import the Windows certificate
        if: matrix.os == 'windows' && steps.signing.outputs.have == '1'
        env:
          CERT_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
        run: |
          CERT_PATH="$RUNNER_TEMP/smartparks.pfx"
          echo -n "$CERT_BASE64" | base64 --decode > "$CERT_PATH"
          echo "CSC_LINK=$CERT_PATH" >> "$GITHUB_ENV"

      - name: Package
        working-directory: electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ matrix.os == 'macos' && steps.signing.outputs.have == '1' && 'true' || 'false' }}
          CSC_KEY_PASSWORD: ${{ matrix.os == 'windows' && secrets.WINDOWS_CERT_PFX_PASSWORD || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          REQUIRE_NOTARIZATION: ${{ matrix.os == 'macos' && github.ref_type == 'tag' && env.REQUIRE_SIGNING == '1' && '1' || '0' }}
        run: |
          npm run build
          npx electron-builder ${{ matrix.electron-builder-args }} --publish never

      - name: What was built
        run: ls -lh electron/dist-build/ | grep -E "\.(exe|dmg|deb|blockmap|yml)$"

      - name: Keep the installers (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-installer
          path: ${{ matrix.artifact-glob }}
          retention-days: 14
          if-no-files-found: error

      - name: Attach the installers to the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" ${{ matrix.artifact-glob }} --clobber

  publish:
    name: Publish the release
    needs: [build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-22.04
    steps:
      - name: Every file is there, so the release goes out
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name'
          for name in ProtectGo-Setup.exe ProtectGo-Setup.exe.blockmap latest.yml ProtectGo-arm64.dmg ProtectGo-amd64.deb; do
            gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | grep -qx "$name" || { echo "::error::$name is missing from the release"; exit 1; }
          done
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
